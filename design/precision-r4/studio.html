<!doctype html><html lang="en"><meta charset="utf-8"><title>AERLOR original studio render</title><style>html,body{margin:0;background:transparent}#studio{width:1600px;height:1600px}canvas{display:block}</style><div id="studio"></div><script type="module">import {createStudio} from '/src/studio-models.ts';let current;window.renderProduct=async(family,finish,view,width=1600,height=1600)=>{current?.dispose();const host=document.getElementById('studio');host.style.width=width+'px';host.style.height=height+'px';current=createStudio(host,family,finish,view,{width,height});current.render();await new Promise(r=>requestAnimationFrame(r));return current.canvas.toDataURL('image/png');};window.studioReady=true;</script></html>
