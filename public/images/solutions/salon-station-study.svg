<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <title>AERLOR professional salon station: conceptual planning study</title>
  <desc>Illustrative top-down diagram of a styling chair, mirror, vanity, dryer rest, power point and working clearance. Not an engineering drawing.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#d6d8d4" stroke-width="1" fill="none"/></pattern>
  </defs>
  <rect width="1200" height="1200" fill="#e8eae7"/>
  <rect x="50" y="50" width="1100" height="1100" fill="url(#grid)" opacity=".7" stroke="#bcc0be" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#2e343b">
    <text x="85" y="115" font-size="19" letter-spacing="3.6" font-weight="bold">AERLOR   /   PROFESSIONAL ENVIRONMENTS</text>
    <text x="85" y="183" font-size="53" letter-spacing="-1.7">Consider the whole station.</text>
    <text x="85" y="223" font-size="20" fill="#5d646b">Concept 01   /   placement, power and working flow</text>
  </g>
  <line x1="85" y1="264" x2="1115" y2="264" stroke="#acb2b2" stroke-width="2"/>
  <!-- Vanity and mirror, schematic overhead -->
  <rect x="255" y="322" width="690" height="132" rx="6" fill="#d9dcd7" stroke="#535d64" stroke-width="4"/>
  <rect x="347" y="316" width="497" height="30" rx="10" fill="#c3cbca" stroke="#687279" stroke-width="3"/>
  <path d="M255 392H945" stroke="#b7bdb8" stroke-width="3"/>
  <rect x="290" y="414" width="114" height="20" rx="5" fill="#c0c7c2"/>
  <rect x="445" y="414" width="130" height="20" rx="5" fill="#c0c7c2"/>
  <text x="602" y="380" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#545c63" text-anchor="middle" letter-spacing="4">MIRROR / VANITY</text>
  <!-- Hairdryer on tool rest -->
  <g transform="translate(802 405) rotate(-16)">
    <rect x="-7" y="-41" width="120" height="48" rx="18" fill="#bcc4c1" stroke="#515c64" stroke-width="4"/>
    <circle cx="109" cy="-16" r="24" fill="#e0e2df" stroke="#515c64" stroke-width="4"/>
    <rect x="35" y="-4" width="27" height="105" rx="12" fill="#c0c9c6" stroke="#515c64" stroke-width="4"/>
    <path d="M47 101C62 121 58 134 69 146" fill="none" stroke="#515c64" stroke-width="3"/>
  </g>
  <!-- Wall outlet and cable -->
  <path d="M869 552C957 551 988 500 996 450C1002 414 1019 391 1065 357" fill="none" stroke="#66737c" stroke-width="4" stroke-dasharray="12 11"/>
  <rect x="1041" y="314" width="65" height="68" rx="5" stroke="#525f69" stroke-width="4" fill="#f5f5f2"/>
  <circle cx="1060" cy="340" r="5" fill="#56616c"/><circle cx="1086" cy="340" r="5" fill="#56616c"/>
  <path d="M1059 353v12M1085 353v12" stroke="#56616c" stroke-width="3"/>
  <!-- Chair -->
  <circle cx="590" cy="654" r="166" stroke="#53606a" stroke-width="5" fill="#d9dfda"/>
  <circle cx="590" cy="654" r="125" stroke="#9aa7a4" stroke-width="3" fill="#f1f2ee"/>
  <rect x="523" y="548" width="134" height="62" rx="26" fill="#c3cbc8" stroke="#5f6c74" stroke-width="3"/>
  <rect x="482" y="630" width="52" height="110" rx="20" fill="#b8c3be" stroke="#5f6c74" stroke-width="3"/>
  <rect x="646" y="630" width="52" height="110" rx="20" fill="#b8c3be" stroke="#5f6c74" stroke-width="3"/>
  <rect x="524" y="625" width="133" height="104" rx="30" fill="#d0d9d4" stroke="#5f6c74" stroke-width="3"/>
  <text x="590" y="788" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="3" fill="#57616a">STYLING CHAIR</text>
  <!-- Working movement arcs -->
  <path d="M356 565A270 270 0 0 0 490 876" fill="none" stroke="#88959a" stroke-dasharray="12 11" stroke-width="3"/>
  <path d="M822 602A268 268 0 0 1 686 874" fill="none" stroke="#88959a" stroke-dasharray="12 11" stroke-width="3"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#2d353d" font-weight="bold">
    <circle cx="897" cy="513" r="30" fill="#283039"/><text x="897" y="522" text-anchor="middle" fill="#fff">01</text>
    <circle cx="1003" cy="282" r="30" fill="#283039"/><text x="1003" y="291" text-anchor="middle" fill="#fff">02</text>
    <circle cx="323" cy="794" r="30" fill="#283039"/><text x="323" y="803" text-anchor="middle" fill="#fff">03</text>
  </g>
  <path d="M920 515L986 564M1006 312L1046 331M351 808L418 848" stroke="#6e777e" stroke-width="2" fill="none"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#424b53" font-size="18" letter-spacing="1">
    <text x="944" y="600">TOOL REST</text>
    <text x="951" y="253">POWER</text>
    <text x="176" y="851">CLEARANCE</text>
  </g>
  <line x1="85" y1="932" x2="1115" y2="932" stroke="#aab0b0" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#39434b">
    <text x="85" y="989" font-size="21" font-weight="bold" letter-spacing="1.8">01 / REACH AND REST</text>
    <text x="85" y="1022" font-size="19" fill="#58636b">Where the dryer lives between clients.</text>
    <text x="85" y="1080" font-size="21" font-weight="bold" letter-spacing="1.8">02 / SITE POWER</text>
    <text x="85" y="1113" font-size="19" fill="#58636b">Outlet position and safe cable routing.</text>
    <text x="665" y="989" font-size="21" font-weight="bold" letter-spacing="1.8">03 / OPERATOR FLOW</text>
    <text x="665" y="1022" font-size="19" fill="#58636b">Chair, workstation and movement area.</text>
    <text x="665" y="1113" font-size="14" fill="#5c666f" letter-spacing="1.2">CONCEPTUAL / NOT AN ELECTRICAL PLAN</text>
  </g>
</svg>